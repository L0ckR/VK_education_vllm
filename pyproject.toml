[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vk-vlm-project"
version = "0.1.0"
description = "Utilities and entry points for VK VLM training and evaluation workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "VK Education" }
]
keywords = ["vlm", "ml", "training", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "accelerate>=1.1.0",
  "datasets>=3.2.0",
  "flash-linear-attention>=0.4.2",
  "peft>=0.14.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.2",
  "tensorboard>=2.20.0",
  "tensorboardx>=2.6.5",
  "torch>=2.4.0",
  "torchvision>=0.26.0",
  "transformers>=4.49.0",
  "wandb>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
vk-vlm-train = "vk_vlm_project.train:main"
vk-vlm-evaluate = "vk_vlm_project.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
