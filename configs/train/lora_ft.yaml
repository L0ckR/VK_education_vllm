name: lora_ft
seed: 42
mixed_precision: bf16
batch_size: 8
grad_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 2.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
lr_scheduler_type: cosine
max_grad_norm: 1.0

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

checkpoint:
  output_dir: checkpoints/lora_ft
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: val_accuracy
  greater_is_better: true

logging:
  logging_steps: 25
  report_to:
    - tensorboard
